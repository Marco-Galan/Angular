<div class="contenedor">
    <h2>Generos</h2>
    <button mat-flat-button routerLink="/generos/crear" class="margin-bottom">Crear nuevo</button>

    <app-listado-generico [listado]="generos">
        <ng-container contenido>
            <table mat-table [dataSource]="generos" class="mat-elevation-z8">
                <ng-container matColumnDef="id">
                    <th mat-header-cell *matHeaderCellDef> Id </th>
                    <td mat-cell *matCellDef="let elemento"> {{elemento.id}} </td>
                </ng-container>

                <ng-container matColumnDef="nombre">
                    <th mat-header-cell *matHeaderCellDef>Nombre</th>
                    <td mat-cell *matCellDef="let elemento"> {{elemento.nombre}} </td>
                </ng-container>

                <ng-container matColumnDef="acciones">
                    <th mat-header-cell *matHeaderCellDef>Acciones</th>
                    <td mat-cell *matCellDef="let elemento"> 
                        <a routerLink="/generos/editar/{{elemento.id}}" mat-flat-button> <mat-icon>edit</mat-icon> Editar</a>
                        <button mat-flat-button class="warn">
                            <mat-icon>delete</mat-icon> Borrar
                        </button>
                     </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="columnasMostrar"></tr>
                <tr mat-row *matRowDef="let row; columns: columnasMostrar"></tr>
            </table>

            <mat-paginator 
            showFirstLastButtons [length]="totalRegistros"
            [pageSize]="paginacion.resultadosPorPagina"
            [pageSizeOptions]="[5, 10, 50]"
            class="mat-elevation-z8"
            (page)="actualizarPaginacion($event)">
            </mat-paginator>

        </ng-container>
    </app-listado-generico>
</div>
